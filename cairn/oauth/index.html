<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Cairn — Signing you in…</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141414; color: #e8e4dc; text-align: center; padding: 24px;
    }
    .card { max-width: 360px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #9e9a94; margin: 0 0 16px; }
    a.btn {
      display: inline-block; text-decoration: none; font-weight: 600; font-size: 15px;
      color: #16082e; background: #7c6af7; border-radius: 10px; padding: 10px 18px;
    }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%;
      border: 3px solid rgba(124,106,247,0.3); border-top-color: #7c6af7;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1>Signing you in…</h1>
    <p id="msg">Returning to Cairn. If nothing happens, tap the button below.</p>
    <a class="btn" id="continue" href="#">Open Cairn</a>
  </div>
  <script>
    /*
     * Cairn OAuth redirect bridge.
     *
     * Strict OAuth providers (e.g. Canva) reject a custom-scheme (cairn://)
     * redirect_uri at /authorize and require an https host. This static page is
     * that https host: it is registered as Cairn's redirect_uri (and listed in
     * the CIMD doc at /cairn/oauth-client.json). The provider redirects the
     * browser here with ?code=…&state=… (or ?error=…); we immediately forward
     * those exact query params to cairn://oauth/callback, which the app's
     * ASWebAuthenticationSession intercepts to complete sign-in.
     *
     * We forward the raw query string verbatim so code/state/error all survive.
     */
    (function () {
      var target = "cairn://oauth/callback" + window.location.search;
      var link = document.getElementById("continue");
      link.href = target;
      // Auto-forward. iOS ASWebAuthenticationSession matches the cairn:// scheme
      // and hands control back to the app before this page fully navigates.
      window.location.replace(target);
      // Fallback copy if the auto-redirect is blocked.
      setTimeout(function () {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("msg").textContent =
          "Tap the button to return to Cairn and finish signing in.";
      }, 1500);
    })();
  </script>
</body>
</html>
