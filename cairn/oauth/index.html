<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Cairn — Signing you in…</title>
  <link rel="icon" href="/assets/images/cairn-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #020617;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-main);
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 20% 0%, rgba(99, 102, 241, 0.12), transparent 45%),
        radial-gradient(circle at 80% 100%, rgba(14, 165, 233, 0.10), transparent 45%);
      color: var(--text-primary);
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 340px;
      width: 100%;
      animation: rise 0.5s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .logo-ring {
      position: relative;
      width: 84px; height: 84px;
      margin: 0 auto 22px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo {
      width: 56px; height: 56px;
      border-radius: 14px;
      display: block;
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.35);
    }
    /* Rotating accent ring around the logo */
    .logo-ring::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #6366f1;
      border-right-color: #0ea5e9;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 19px; font-weight: 600; margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 14px; line-height: 1.55; color: var(--text-secondary);
      margin: 0 0 20px;
    }
    a.btn {
      display: none; /* shown only if auto-redirect is blocked */
      text-decoration: none; font-weight: 600; font-size: 15px;
      color: #fff; background: var(--accent-gradient);
      border-radius: 12px; padding: 12px 22px;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }
    a.btn.show { display: inline-block; }
    .dots::after {
      content: ""; animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; } 25% { content: "."; }
      50% { content: ".."; } 75% { content: "..."; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-ring">
      <img class="logo" src="/assets/images/cairn-icon.png" alt="Cairn" />
    </div>
    <h1>Connecting to Cairn</h1>
    <p id="msg"><span class="dots">Finishing sign-in</span></p>
    <a class="btn" id="continue" href="#">Return to Cairn</a>
  </div>
  <script>
    /*
     * Cairn OAuth redirect bridge.
     *
     * Some OAuth providers reject a custom-scheme (cairn://) redirect_uri and
     * require an https host. This static page is that https host: it's registered
     * as Cairn's redirect_uri (and listed in the CIMD doc at
     * /cairn/oauth-client.json). The provider redirects the browser here with
     * ?code=…&state=… (or ?error=…); we forward those exact query params to
     * cairn://oauth/callback, which the app's ASWebAuthenticationSession
     * intercepts to complete sign-in. The query string is forwarded verbatim so
     * code/state/error all survive.
     *
     * We wait briefly before forwarding so the user sees this is the genuine
     * Cairn flow (branded page + logo) rather than an instant, jarring flash.
     */
    (function () {
      var target = "cairn://oauth/callback" + window.location.search;
      var link = document.getElementById("continue");
      link.href = target;

      // Deliberate branded pause, then hand back to the app.
      setTimeout(function () {
        window.location.replace(target);
      }, 1800);

      // If the auto-redirect is blocked (rare), reveal a manual button.
      setTimeout(function () {
        document.querySelector(".logo-ring").style.setProperty("--paused", "1");
        document.getElementById("msg").textContent =
          "Almost there — tap below to return to Cairn and finish signing in.";
        link.classList.add("show");
      }, 3200);
    })();
  </script>
</body>
</html>
